{
  "_base_": [
    "./exp020_mmdet_cascade_maskrcnn_r50_tile_train_tile_infer.yaml"
  ],
  "experiment": {
    "id": "EXP-PL-v1",
    "name": "exp031_cascade_r50_fold0_plus_pl001_tile_finetune"
  },
  "model": {
    "family": "mmdet_cascade_mask_rcnn_r50_fpn",
    "name": "cascade_mask_rcnn_r50_fpn",
    "num_classes": 4,
    "pretrained_detector_checkpoint": "outputs/runs/exp020_cascade_maskrcnn_r50_tile_train_tile_infer/epoch_8.pth"
  },
  "runtime": {
    "work_dir": "outputs/runs/exp031_cascade_r50_fold0_plus_pl001_tile_finetune",
    "max_epochs": 8,
    "train_batch_size": 1,
    "accumulative_counts": 2,
    "num_workers": 1,
    "disable_validation": true,
    "checkpoint": {
      "interval": 1,
      "save_begin": 1,
      "save_last": true,
      "max_keep_ckpts": -1,
      "save_best": null
    }
  },
  "optimizer": {
    "lr": 0.00025,
    "momentum": 0.9,
    "weight_decay": 0.0001
  },
  "schedule": {
    "warmup_iters": 100,
    "warmup_start_factor": 0.001,
    "milestones": [6],
    "gamma": 0.1
  },
  "dataset": {
    "additional_tiled_datasets": [
      {
        "name": "pl001_ens003_w075_test_tiles",
        "dataset_label": "pl001_ens003_w075_test",
        "source_coco": "data/interim/pseudo_labels/pl001_ens003_w075/instances_test_pseudo_filtered.json",
        "image_root": "data/test_release",
        "output_root": "data/interim/tiled_train/pl001_ens003_w075_test_tile768x768_ov0",
        "tile_size": 768,
        "overlap": 0.0,
        "min_tile_coverage": 0.0,
        "drop_empty_tiles": true,
        "min_visible_fraction": 0.5,
        "min_gt_area": 1.0,
        "force_rebuild": false
      }
    ]
  },
  "inference": {
    "postprocess": {
      "score_thr": 0.03,
      "max_per_img": 1000,
      "nms": {
        "type": "nms",
        "iou_threshold": 0.5
      }
    },
    "sweep": {
      "max_runs": 1,
      "score_thr_values": [0.03],
      "max_per_img_values": [1000],
      "nms_iou_threshold_values": [0.5]
    },
    "tiled": {
      "enabled": true,
      "tile_size": 768,
      "overlap": 0.25,
      "min_tile_coverage": 0.0,
      "tile_batch_size": 1,
      "drop_border_predictions": false
    }
  }
}
